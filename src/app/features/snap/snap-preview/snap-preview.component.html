<p-progressSpinner
  *ngIf="loadingPreview$ | async"
  class="mt-8"
  styleClass="w-24 h-24"
  strokeWidth="5"
  ariaLabel="Loading snapped website"
/>

<p-card
  class="rounded-md mt-8 border-solid border border-[--primary-100] shadow-lg"
  *ngIf="snapData.showSnappedImage"
>
  <ng-template pTemplate="header">
    <h1 class="font-bold text-3xl text-center !mt-5">Snap Preview</h1>
  </ng-template>

  <ng-template pTemplate="content">
    <p-image
      [src]="snapData.snapUrl"
      alt="Preview Image of input dinaymic value here"
      styleClass="rounded-lg max-w-96"
      imageClass="w-full rounded-lg"
      [preview]="true"
    />
  </ng-template>
  <ng-template pTemplate="footer">
    <div class="flex gap-4">
      <p-button
        label="Close"
        (click)="this.snapData.showSnappedImage = false"
        severity="secondary"
        class="w-full"
        outlined
        styleClass="w-full"
      />
      <p-button label="Download" class="w-full" styleClass="w-full" (onClick)="downloadImage()" [loading]="loadingDownload"/>
    </div>
  </ng-template>
</p-card>
