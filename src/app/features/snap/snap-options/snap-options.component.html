<p-dialog
  header="Options"
  [modal]="true"
  [(visible)]="showPopup"
  [style]="{ width: '20rem', height: '25rem' }"
  (onHide)="this.updateShowPopup(false)"
>
  <div class="grid grid-rows-2 gap-2">
    <div class="flex items-start justify-start flex-row gap-2 mt-2">
      <label
        for="captureFullPage"
        class="flex items-center justify-center gap-4"
      >
        Capture Full Page
      </label>
      <p-inputSwitch
        [(ngModel)]="this.snapOptions.captureFullPage"
        id="captureFullPage"
        pTooltip="Capture the entire webpage, not just the visible part."
        class="flex items-center justify-center gap-4"
        (ngModelChange)="updateCaptureFullPage($event)"
      />
    </div>
    <div class="flex items-start flex-col gap-2">
      <label for="viewport">ViewPort</label>
      <input
        type="url"
        pInputText
        [(ngModel)]="this.snapOptions.viewport"
        pTooltip="Specify the width and height for the screenshot."
        name="viewport"
        (input)="checkViewPort(this.snapOptions.viewport)"
        maxlength="9"
        placeholder="1280x720"
      />
      <small *ngIf="isViewPortInvalid" class="error">
        Current viewport it's not correct, use this pattern
        <code>1920x1080</code>
      </small>
    </div>

    <div class="flex items-start flex-col gap-2">
      <label for="name">Image Format</label>
      <p-dropdown
        [options]="this.imageFormats"
        [(ngModel)]="this.snapOptions.imageFormat"
        optionLabel="format"
        placeholder="Select the image format"
        (onChange)="this.updateImageFormat($event.value)"
      />
    </div>
  </div>
</p-dialog>
